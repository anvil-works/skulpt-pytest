name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      SKULPT_DIST: ${{ github.workspace }}/.scratch/skulpt/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: anvil-works/skulpt
          ref: 8b57825df89c64fbf5ea104bc5530b05e091fcb1
          path: .scratch/skulpt
      - run: npm ci && npm run devbuild
        working-directory: .scratch/skulpt
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm build
      - run: SKULPT_CORE=skulpt.js pnpm test:package
      - run: npm run build
        working-directory: .scratch/skulpt
      - run: pnpm build:demo
      - run: pnpm test:package
      - run: pnpm test
